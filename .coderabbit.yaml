# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

reviews:
  # CodeRabbit stopped auto-reviewing repos with fewer than 10 stars, and its
  # only output here was a "review skipped" comment (and email) on every PR.
  # Review on demand instead: comment `@coderabbitai review` on the PR.
  auto_review:
    enabled: false
  review_status: false
